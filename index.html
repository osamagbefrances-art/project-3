<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="card balance">
        <h3>Your Balance</h3>
        <p id="balance-amount">$0.00</p>
      </div>
      <div class="card income">
        <h3>Total Income</h3>
        <p id="income-amount">+$0.00</p>
      </div>
      <div class="card expense">
        <h3>Total Expense</h3>
        <p id="expense-amount">-$0.00</p>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <section class="form-section">
      <h2>Add New Transaction</h2>
      <form id="transaction-form">
        <div class="form-control">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Salary, Rent, Grocery" required>
        </div>

        <div class="form-control">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" placeholder="e.g. 500 or -150" required>
          <small>Use positive (+) for income and negative (-) for expense</small>
        </div>

        <button type="submit" class="btn">Add Transaction</button>
      </form>
    </section>

    <!-- Filter & Transaction History Table -->
    <section class="history-section">
      <div class="history-header">
        <h2>Transaction History</h2>
        <select id="filter-select">
          <option value="all">All Transactions</option>
          <option value="income">Income Only</option>
          <option value="expense">Expenses Only</option>
        </select>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="transaction-list">
            <!-- Dynamic Transaction Rows -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
